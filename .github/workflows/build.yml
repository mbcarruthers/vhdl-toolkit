name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch VHDL-LS binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-vhdl-ls.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon test buildPlugin

      - name: Verify plugin against CLion
        run: ./gradlew --no-daemon verifyPlugin || true

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: vhdl-toolkit-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
